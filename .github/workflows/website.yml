name: Publish Talaria website

on:
  push:
    branches: [main]
    paths:
      - "website/dist/**"
      - "website/scripts/check.py"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/dist/**"
      - "website/scripts/check.py"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Validate static website
        run: python3 website/scripts/check.py

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
